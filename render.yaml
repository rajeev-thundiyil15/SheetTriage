# Render blueprint: New > Blueprint in the Render dashboard, then pick this repo.
services:
  - type: web
    name: sheettriage
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
